[tools]
node = "26.12.1"

[settings]
# pnpm の版は package.json の packageManager を正本にし、mise はそれを読む。
# リポジトリの設定はグローバルの値を置き換え、CI はグローバル設定を読まないので明示する。
idiomatic_version_file_enable_tools = ["pnpm"]

[tasks.install]
description = "依存をインストールする"
run = "pnpm install"

[tasks.login]
description = "Qiita CLI にログインする"
run = "pnpm exec qiita login"

[tasks.new]
description = "新規記事を作成する (usage: mise run new <basename>)"
run = "bash scripts/new.sh"

[tasks.preview]
description = "ローカルプレビューを起動する"
run = "pnpm exec qiita preview"

[tasks.pull]
description = "Qiita から記事を同期する (上書きは mise run pull -- --force)"
run = "pnpm exec qiita pull"

[tasks.publish]
description = "記事を Qiita へ公開する"
run = "pnpm exec qiita publish --all"
