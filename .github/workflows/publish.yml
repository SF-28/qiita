# Please set 'QIITA_TOKEN' secret to your repository
name: Publish articles

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish_articles:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # 記事の公開後に public/ の差分を git push するため contents: write が要る。
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: increments/qiita-cli/actions/publish@291d95f1527386130aec99a07634077fa38779bd # v1.12.0
        with:
          qiita-token: ${{ secrets.QIITA_TOKEN }}
          root: "."
